<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeadHunt · Candidate</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/candidate/config.js"></script>
<style>
:root{--gut:clamp(20px,4vw,56px);--ink:#111315;--paper:#fcfcfb;--ground:#eef1f2;--muted:#62696f;--line:#d3d8db;--line2:#9ca5aa;--accent:#d94b24;--accent2:#b03a17;--panel:#f6f8f8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);min-height:100%}
body{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{display:block}
#screen{width:100%;background:var(--paper)}
.page{width:100%;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.tiny{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.dim{color:var(--muted)}
.accenttext{color:var(--accent)}
a{color:var(--accent);text-decoration:none;font-size:14px}
a:hover{color:var(--accent2)}

.bar{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 var(--gut);background:var(--ink);color:#fff;flex-shrink:0}
.bar .dim{color:#fff}
.brand{display:flex;align-items:baseline;gap:13px}
.wordmark{font-size:21px;font-weight:700;line-height:1;letter-spacing:.1em;text-transform:uppercase}
.rule{width:1px;height:16px;background:rgba(255,255,255,.35)}
.brandsub{font-size:21px;font-weight:400;line-height:1;color:#fff;letter-spacing:.01em}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

.steps{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ground);border-bottom:1px solid var(--line);flex-shrink:0}
.step{padding:13px 14px;border-top:3px solid var(--line)}
.step:first-child{padding-left:var(--gut)}
.step:last-child{padding-right:var(--gut)}
.step .mono{color:#9ca5aa}
.step .name{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.step.done{border-top-color:var(--ink)}
.step.done .mono{color:var(--muted)}
.step.on{border-top-color:var(--accent)}
.step.on .mono{color:var(--accent)}
.step.on .name{color:var(--ink);font-weight:700}
.step.clickable{cursor:pointer}
.step.clickable:hover .name{color:var(--ink)}

.body{padding:clamp(28px,5vw,52px) var(--gut) 26px;flex-grow:1}
.body.narrow{max-width:760px}
.body.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{margin:0 0 16px;font-size:clamp(42px,7.5vw,100px);font-weight:700;line-height:1.02;text-transform:uppercase}
h2{margin:0 0 10px;font-size:clamp(26px,4vw,44px);font-weight:700;line-height:1.04;max-width:760px}
h2.big{font-size:clamp(34px,6vw,64px)}
.lede{margin:0 0 30px;font-size:16px;line-height:1.6;color:var(--muted);max-width:620px}
.lede.big{font-size:18px;color:#373c40}
.eyebrow{margin:0 0 14px;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fine{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.fine.light{color:#b9c0c4}
.lbl{display:block;margin:0 0 7px;font-size:14px;font-weight:700}
.mt{margin-top:22px}
.mt-sm{margin-top:14px}
.err{margin:10px 0 0;min-height:18px;font-size:14px;color:#a63e1c}
.grey{color:var(--line2)}

.field{width:100%;max-width:520px;padding:0 16px;min-height:54px;border:1px solid var(--line2);border-radius:4px;background:#fff;font-family:inherit;font-size:16px;color:var(--ink);outline:none}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(217,75,36,.12)}
.field.wide{max-width:660px}
.field.short{max-width:110px}
.field.area{max-width:760px;padding:14px 16px;line-height:1.55;resize:vertical}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 24px,calc(100% - 14px) 24px;background-size:6px 6px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:760px}
.sub{margin-top:18px}

.cta{display:inline-flex;align-items:center;gap:16px;padding:14px 26px;background:var(--ink);color:#fff;border:0;border-radius:0;cursor:pointer;font-family:inherit;font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:background 160ms}
.cta:hover{background:#2b2f33}
.cta.accent{background:var(--accent)}
.cta.accent:hover{background:var(--accent2)}
.cta.off{background:#b9c0c4;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);padding:0}
.foot{display:flex;align-items:center;justify-content:space-between;padding:18px var(--gut);background:var(--ground);border-top:1px solid var(--line);flex-shrink:0}
.footright{display:flex;align-items:center;gap:22px}

.oauthrow{display:flex;gap:12px;margin-bottom:22px}
.oauth{display:inline-flex;align-items:center;gap:11px;padding:14px 22px;border:1px solid var(--line2);border-radius:4px;background:#fff;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink)}
.oauth:hover{border-color:var(--ink)}
.or{display:flex;align-items:center;gap:14px;max-width:520px;margin:0 0 22px}
.or .line{flex:1;height:1px;background:var(--line)}

.otp{display:flex;gap:12px;margin:0 0 20px}
.cell{width:64px;height:76px;text-align:center;border:1px solid var(--line);border-radius:4px;background:#fff;font-family:inherit;font-size:34px;font-weight:700;color:var(--ink);outline:none}
.cell:focus{border:1.5px solid var(--accent)}
.row{display:flex;align-items:center}
.row.gap{gap:20px}
.vrule{width:1px;height:15px;background:var(--line)}
.phonerow{display:flex;gap:10px;max-width:520px}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:980px}
.card{padding:22px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;min-height:150px;transition:border-color 140ms,background 140ms}
.card:hover{border-color:var(--line2)}
.card.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card.tall{min-height:0;padding:13px 15px;margin-top:8px}
.cardtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cardtop .mono{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card.on .cardtop .mono{color:#9ca5aa}
.cardval{margin:0 0 6px;font-size:16px;font-weight:700}
.cardhelp{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.card.on .cardhelp{color:#b9c0c4}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2)}
.dot.on{background:var(--accent);border-color:var(--accent)}

.panel{max-width:660px;margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.panel.dark{background:var(--ink);border-color:var(--ink);color:#fff;max-width:520px}
.panel.dark .mono{color:#9ca5aa}
.huge{margin:6px 0 10px;font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1;text-transform:uppercase}
.consent{display:grid;grid-template-columns:26px minmax(0,1fr);gap:14px;margin:14px 0;cursor:pointer}
.consent p{margin:0;font-size:14px;line-height:1.55}
.check{width:22px;height:22px;margin-top:1px;border-radius:3px;border:1.5px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
.check svg{opacity:0}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on svg{opacity:1}

.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:780px}
.chip{padding:9px 15px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink)}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.chips.big .chip{padding:13px 20px;font-size:16px;border-color:var(--line2)}
.chip.sm{font-size:13px;padding:7px 12px}

.rows{max-width:860px;margin-top:8px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 170px 76px;gap:18px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top-color:var(--line2)}
.frow:last-child{border-bottom:1px solid var(--line2)}
.fname{margin:0 0 2px;font-size:15px;font-weight:700}
.rowsplit{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
.upload{display:inline-flex;align-items:center;gap:9px;margin-top:12px;padding:10px 16px;border:1px solid var(--ink);border-radius:4px;cursor:pointer;font-size:14px;font-weight:700}

.split{display:grid;grid-template-columns:322px minmax(0,1fr);flex-grow:1}
.split.wide{grid-template-columns:minmax(0,1.25fr) 420px;padding:0}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:24px 24px 18px var(--gut);display:flex;flex-direction:column}
.rail.right{border-right:0;border-left:1px solid var(--line);background:var(--paper);padding:44px var(--gut) 26px 32px;gap:18px}
.railrow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:11px;padding:8px 0;border-top:1px solid #e2e6e8;cursor:pointer}
.railrow:first-of-type{border-top-color:var(--line2)}
.railrow .mono{padding-top:3px;color:#b9c0c4}
.rt{margin:0;font-size:13.5px;color:var(--line2)}
.ra{margin:1px 0 0;font-size:12.5px;color:var(--line2)}
.railrow.done .mono,.railrow.done .rt{color:var(--muted)}
.railrow.on .mono{color:var(--accent)}
.railrow.on .rt{color:var(--ink);font-weight:700}
.railrow.on .ra{color:var(--accent)}
.pushdown{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.note{border-left:4px solid #265f8c;padding:2px 0 2px 18px}

.combo{position:relative;max-width:660px}
.menu{display:none;position:absolute;top:60px;left:0;right:0;z-index:5;background:#fff;border:1px solid var(--ink);border-radius:4px;box-shadow:0 12px 30px rgba(17,19,21,.12);overflow:hidden}
.menu.show{display:block}
.mi{padding:11px 16px;font-size:15px;cursor:pointer}
.mi:hover{background:var(--ground)}
.moneyrow{display:flex;align-items:center;gap:12px}

.hero .herobody{padding:clamp(48px,10vw,132px) var(--gut) 36px;flex-grow:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--ground)}
.stat{padding:18px 22px 20px;border-right:1px solid var(--line)}
.stat:first-child{padding-left:var(--gut)}
.stat:last-child{border-right:0;padding-right:var(--gut)}
.statnum{margin:0 0 3px;font-size:clamp(22px,2.4vw,30px);font-weight:700;line-height:1}
.herofoot{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:44px;align-items:center;padding:26px var(--gut) 30px;border-top:1px solid var(--line)}
.quote{max-width:560px;font-size:12px;line-height:1.7}

.curtainwrap{position:relative;width:100%;min-height:100dvh;overflow:hidden;cursor:pointer}
.curtain{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--accent);color:#fff;transform:translateY(0);transition:transform 1100ms cubic-bezier(.76,0,.24,1)}
.curtain.up{transform:translateY(-100%)}
.curtain .bar{background:transparent}
.curtainbody{flex-grow:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gut)}
.knock b{font-weight:700;color:inherit}
.knock{margin:0 0 30px;max-width:940px;font-size:clamp(21px,3.4vw,40px);line-height:1.28}
.knock.bold{margin:0;font-weight:700}
.curtainfoot{display:flex;align-items:center;justify-content:space-between;padding:0 var(--gut) 34px;color:rgba(255,255,255,.78);font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}

.pulse{width:54px;height:54px;margin-bottom:26px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.72);opacity:.35}50%{transform:scale(1);opacity:1}}

#devbar{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:16px;padding:0 18px;background:#111315;color:#8f979c;font-family:'SFMono-Regular',Consolas,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;z-index:20}
#devbar button{background:none;border:1px solid #3d4246;border-radius:3px;color:#d8dcde;padding:6px 12px;font:inherit;cursor:pointer}
#devbar button:hover{border-color:var(--accent)}
#devbar{display:none}

/* one-page terms */
.body.tight{padding:34px var(--gut) 20px}
.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:20px}
.headline h2{font-size:clamp(26px,4vw,42px);margin-bottom:6px}
.headline .lede{margin:0;max-width:640px}
.qlist{max-width:1100px}
.qrow{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top-color:var(--line2)}
.qrow:last-child{border-bottom:1px solid var(--line2)}
.qrow.missing{background:#fdf2ee;box-shadow:-14px 0 0 #fdf2ee,14px 0 0 #fdf2ee}
.qt{margin:0 0 2px;font-size:14.5px;font-weight:700;line-height:1.3}
.qh{margin:0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.qctl{display:flex;flex-direction:column;gap:7px}
.chips.tight{gap:6px}
.chip.xs{font-size:12px;padding:5px 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:700px}
.field.slim{max-width:320px;min-height:42px;font-size:15px}
.moneyrow.slim{gap:8px}
.combo .menu{top:48px;max-width:320px}


@media (max-width:1000px){
  .split,.split.wide{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:20px var(--gut)}
  .rail.right{border-left:0;border-top:1px solid var(--line);padding:26px var(--gut) 30px}
  .panel.dark{max-width:100%}
}
@media (max-width:820px){
  .grid3,.grid2,.two{grid-template-columns:minmax(0,1fr)}
  .qrow{grid-template-columns:minmax(0,1fr);gap:10px;padding:14px 0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{border-right:0;border-bottom:1px solid var(--line);padding-left:var(--gut);padding-right:var(--gut)}
  .herofoot{grid-template-columns:minmax(0,1fr);gap:22px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .step:first-child,.step:last-child{padding-left:var(--gut);padding-right:var(--gut)}
  .headline{flex-direction:column;align-items:flex-start;gap:10px}
  .foot{flex-direction:column;align-items:stretch;gap:14px}
  .footright{justify-content:space-between}
  .cta{width:100%;justify-content:space-between}
  .oauthrow{flex-direction:column}
  .or{max-width:100%}
  .field,.field.wide,.field.slim,.field.area{max-width:100%}
  .cell{width:48px;height:62px;font-size:26px}
  .otp{gap:8px}
  .card{min-height:0}
}
@media (max-width:640px){
  .bar > span{display:none}
  .bar{padding-top:14px;padding-bottom:14px}
}
@media (max-width:480px){
  .cell{width:100%;height:58px;font-size:22px}
  .otp{gap:6px}
  .row.gap{flex-wrap:wrap;gap:12px}
  .vrule{display:none}
}
</style>
</head>
<body>
<div id="viewport"><div id="screen"></div></div>
<div id="devbar">
  <span>Demo build &middot; nothing leaves this page</span>
  <button data-act="wipe">Start over</button>
  <span id="where"></span>
</div>
<script>
/* ==================================================================
   HeadHunt Candidate — live build
   ------------------------------------------------------------------
   PASTE YOUR TWO SUPABASE VALUES HERE.
   Supabase dashboard > Project Settings > API
   Both of these are meant to be public. They are safe in this file.
   ================================================================== */

const DEFAULTS = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: '',

  // Turn these on as you set each one up. Leave false and the flow
  // simply skips that step instead of breaking.
  GOOGLE_SIGNIN: false,
  APPLE_SIGNIN: false,
  WHATSAPP: false,
  LINKEDIN_ENRICHMENT: false
};

// Everything above is overridden by config.js, which sits next to this
// file and is the only file holding your keys. Never edit this block.
const CONFIG = Object.assign({}, DEFAULTS, window.HH_CONFIG || {});

/* ------------------------------------------------------------------ */

const CONFIGURED = CONFIG.SUPABASE_URL.indexOf('http') === 0;
let sb = null;
try {
  if (CONFIGURED && window.supabase) sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
} catch (e) { sb = null; }

const API = {

  async startOAuth(provider) {
    if (!sb) return { ok: false, reason: 'not-configured' };
    const { error } = await sb.auth.signInWithOAuth({
      provider: provider,
      options: { redirectTo: location.origin + '/candidate/reach' }
    });
    if (error) return { ok: false, reason: error.message };
    return new Promise(function () {}); // the browser is leaving this page
  },

  async sendEmailCode(email) {
    if (!sb) return { ok: true, demo: true };
    const { error } = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
    if (error) return { ok: false, reason: error.message };
    return { ok: true, expiresInSec: 3600 };
  },

  async verifyEmailCode(email, code) {
    if (!sb) return { ok: /^\d{6}$/.test(code), demo: true };
    let { data, error } = await sb.auth.verifyOtp({ email: email, token: code, type: 'email' });
    if (error) {
      const retry = await sb.auth.verifyOtp({ email: email, token: code, type: 'signup' });
      data = retry.data; error = retry.error;
    }
    if (error) return { ok: false, reason: error.message };
    // Signing back in replays this same call with no fresh name typed in,
    // and S.referrer falls back to a placeholder on a device with nothing
    // saved locally: only write these on a genuine fresh invite open, so a
    // sign-in never blanks out what a first verification already saved.
    const fields = { email: email };
    if (S.fullName) fields.full_name = S.fullName;
    if (S.inviteState === 'ok' && S.referrer) fields.referred_by = S.referrer;
    await upsert(fields);
    return { ok: true, email: email, userId: data.user ? data.user.id : null };
  },

  // WhatsApp needs an approved Meta template, so it stays off until
  // CONFIG.WHATSAPP is true. The option is hidden on the reach screen
  // while it is false.
  async sendWhatsAppCode(phone) { await wait(600); return { ok: true }; },
  async verifyWhatsAppCode(phone, code) { await wait(500); return { ok: /^\d{6}$/.test(code) }; },

  async saveContactChannel(channel, value, verified) {
    return upsert({ contact_channel: channel, contact_value: value, contact_verified: verified !== false });
  },

  // Until you have a licensed enrichment provider this stores the URL
  // and the consent, and you read the profile yourself.
  async fetchLinkedIn(url) {
    await upsert({ linkedin_url: url, consent_profile: S.consent.profile, consent_signalmap: S.consent.signalmap });
    if (!CONFIG.LINKEDIN_ENRICHMENT) return { ok: true, skipped: true, items: [] };
    await wait(1500);
    return { ok: true, items: [] };
  },

  async saveProfile(state) {
    const t = state.terms;
    return upsert({
      work_url: state.builder.url,
      work_kind: state.builder.kind,
      work_kind_other: state.builder.other,
      paxel_url: state.builder.paxel,
      city: t.city,
      cash_floor: t.floor,
      cash_to_equity: t.swap,
      team_size: t.team,
      office_days: t.days,
      earliest_start: t.start,
      notice_weeks: t.start === 'notice' ? t.noticeWeeks : null,
      relocation: t.reloc,
      preferred_cities: t.reloc === 'yes' ? t.relocCities : [],
      industries_preferred: t.industry === 'some' ? t.industries : [],
      interview_steps_ok: t.trial,
      looking_note: t.note,
      intent: state.intent
    });
  },

  async saveIntent(intent) { return upsert({ intent: intent }); },

  // "Delete everything" used to only clear this browser's local storage:
  // the database row, and the signed-in session, both survived. This
  // removes the saved row and signs out, so a later invite starts a
  // genuinely fresh row rather than upserting onto stale leftovers. The
  // referral they originally used stays spent either way, single-use is
  // about that slot, not about whether this candidate still has data.
  async deleteMyProfile() {
    if (!sb) return { ok: true, demo: true };
    const user = await currentUser();
    if (user) { await sb.from('candidates').delete().eq('id', user.id); }
    await sb.auth.signOut();
    return { ok: true };
  },

  // Signing back in on a lost/different session: read back whatever was
  // already saved under this account so the flow can resume instead of
  // restarting. RLS only allows a user to read their own row.
  async getMyProfile() {
    if (!sb) return null;
    const user = await currentUser();
    if (!user) return null;
    const { data, error } = await sb.from('candidates').select('*').eq('id', user.id).maybeSingle();
    if (error) return null;
    return data;
  },

  async submitVouch(v) {
    if (!sb) { await wait(500); return { ok: true, id: 'demo', code: 'DEMO2345' }; }
    const user = await currentUser();
    if (!user) return { ok: false, reason: 'not signed in' };
    const { data, error } = await sb.from('referrals')
      .insert({ referrer_id: user.id, referrer_name: v.from, linkedin: v.linkedin, email: v.email, note: v.why })
      .select('id, code').single();
    if (error) return { ok: false, reason: error.message };
    return { ok: true, id: data.id, code: data.code };
  },

  async lookupInvite(code) {
    if (!sb) return { state: 'ok', referrer_name: 'Sanjana', expires_at: new Date(Date.now() + 12096e5).toISOString() };
    const { data, error } = await sb.rpc('invite_lookup', { p_code: code });
    if (error) return { state: 'error', reason: error.message };
    const row = Array.isArray(data) ? data[0] : data;
    return row || { state: 'unknown' };
  },

  async canUseInvite(code, email) {
    if (!sb) return { ok: true };
    const { data, error } = await sb.rpc('invite_can_use', { p_code: code, p_email: email });
    if (error) return { ok: true };
    const row = Array.isArray(data) ? data[0] : data;
    return row || { ok: true };
  },

  async requestInvite(r) {
    if (!sb) { await wait(500); return { ok: true }; }
    const { error } = await sb.rpc('request_invite', {
      p_name: r.name, p_email: r.email, p_linkedin: r.linkedin, p_note: r.note
    });
    if (error) return { ok: false, reason: error.message };
    return { ok: true };
  },

  async openInvite(code) {
    if (!sb || !code) return;
    try { await sb.rpc('invite_open', { p_code: code }); } catch (e) { /* best effort */ }
  },

  async redeemInvite(code) {
    if (!sb || !code) return null;
    try {
      const { data } = await sb.rpc('invite_redeem', { p_code: code });
      return data || null;
    } catch (e) { return null; }
  }
};

async function currentUser() {
  if (!sb) return null;
  const { data } = await sb.auth.getUser();
  return data ? data.user : null;
}

async function upsert(fields) {
  if (!sb) return { ok: true, demo: true };
  const user = await currentUser();
  if (!user) return { ok: false, reason: 'not signed in' };
  const row = Object.assign({ id: user.id, updated_at: new Date().toISOString() }, fields);
  const { error } = await sb.from('candidates').upsert(row);
  if (error) { console.warn('[headhunt] save failed:', error.message); return { ok: false, reason: error.message }; }
  return { ok: true };
}

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

function daysLeft() {
  if (!S.expiresAt) return null;
  const d = Math.ceil((new Date(S.expiresAt).getTime() - Date.now()) / 86400000);
  return isFinite(d) ? d : null;
}

function inviteLabel() {
  const d = daysLeft();
  if (d === null) return 'Invitation';
  if (d <= 0) return 'Invitation \u00b7 expired';
  return 'Invitation \u00b7 expires in ' + d + (d === 1 ? ' day' : ' days');
}

// Nested objects in BLANK (terms, builder, …) need their own merge: a
// plain Object.assign only merges top-level keys, so a saved `terms` from
// before a field existed (relocCities, note, …) would wholesale replace
// the new default and silently drop it, crashing anything that reads it.
function load() {
  try {
    const raw = localStorage.getItem('hh_candidate_v1');
    if (raw) {
      const blank = JSON.parse(JSON.stringify(BLANK));
      const saved = JSON.parse(raw);
      const merged = Object.assign({}, blank, saved);
      ['auth', 'contact', 'consent', 'request', 'builder', 'terms'].forEach(function (k) {
        merged[k] = Object.assign({}, blank[k], saved[k] || {});
      });
      // "trial" moved from a single value to a multi-select array, and
      // "reloc" dropped its old "right" (for the right one) option: a
      // stale shape here would crash the multi-select toggle rather than
      // just render as unanswered, so normalize rather than merge blind.
      if (!Array.isArray(merged.terms.trial)) merged.terms.trial = [];
      if (merged.terms.reloc !== 'no' && merged.terms.reloc !== 'yes') merged.terms.reloc = '';
      if (merged.terms.start !== 'now' && merged.terms.start !== 'notice') merged.terms.start = '';
      return merged;
    }
  } catch (e) { /* private mode, blocked storage */ }
  return JSON.parse(JSON.stringify(BLANK));
}

function save() {
  try { localStorage.setItem('hh_candidate_v1', JSON.stringify(S)); } catch (e) { /* ignore */ }
}

function reset() {
  S = JSON.parse(JSON.stringify(BLANK));
  save();
  render();
}

function go(screen) {
  S.screen = screen;
  save();
  render();
  window.scrollTo(0, 0);
  const root = document.getElementById('screen');
  if (root) { root.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(0.22,1,0.36,1)' }); }
}

function answerOf(q) {
  const v = S.terms[q.key];
  if (q.type === 'multipick') return v && v.length ? v.map(function (id) {
    const hit = q.options.filter(function (o) { return o[0] === id; })[0];
    return hit ? hit[1] : id;
  }).join(', ') : '';
  if (!v && v !== 0) return '';
  if (q.type === 'city') return v;
  if (q.type === 'money') return '₹' + v + ' LPA';
  if (q.key === 'industry' && v === 'some') return S.terms.industries.length ? S.terms.industries.join(', ') : 'Some';
  const hit = q.options.filter(function (o) { return o[0] === v; })[0];
  return hit ? hit[1] : '';
}

/* ---------------------------- render + events ---------------------------- */

function render() {
  const el = document.getElementById('screen');
  el.innerHTML = (VIEWS[S.screen] || VIEWS.curtain)();
  wire();
}

function val(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function err(id, msg) { const e = document.getElementById(id); if (e) e.textContent = msg || ''; }
function busy(btnAct, on, label) {
  const b = document.querySelector('[data-act="' + btnAct + '"]');
  if (!b) return;
  b.disabled = on;
  b.classList.toggle('off', on);
  if (label) b.querySelector('span').textContent = label;
}
function okEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s); }
// A real linkedin.com/in/ or /pub/ profile URL only. The old check also
// accepted any bare word of 3+ characters as "close enough," which let
// anything through unflagged; this also rejects lookalikes like
// linkedin.com.evil.com the same way the Paxel field already does.
function okLinkedIn(s) {
  return /^(https?:\/\/)?([a-z]{1,3}\.)?(www\.)?linkedin\.com\/(in|pub)\/[a-zA-Z0-9À-ÿ][a-zA-Z0-9À-ÿ-]{1,98}\/?(\?.*)?$/i.test(String(s || '').trim());
}

// Only a Paxel results link. Anything else is not what we asked for.
function okPaxel(s) { return /^https:\/\/(www\.)?paxel\.ycombinator\.com\/results\/[A-Za-z0-9_-]{3,64}\/?$/.test(String(s || '').trim()); }

// Rebuild local state from a saved candidates row after signing back in,
// so a resumed screen shows what was already filled instead of blanks.
function hydrateFromRow(row) {
  if (row.full_name) S.fullName = row.full_name;
  if (row.referred_by) S.referrer = row.referred_by;
  S.contact.channel = row.contact_channel || '';
  if (row.contact_channel === 'whatsapp') S.contact.phone = row.contact_value || '';
  S.contact.verified = !!row.contact_verified;
  S.linkedinUrl = row.linkedin_url || '';
  S.consent.profile = !!row.consent_profile;
  S.consent.signalmap = !!row.consent_signalmap;
  S.builder.url = row.work_url || '';
  S.builder.kind = row.work_kind || '';
  S.builder.other = row.work_kind_other || '';
  S.builder.paxel = row.paxel_url || '';
  if (row.city) {
    S.terms.city = row.city;
    S.terms.floor = row.cash_floor || S.terms.floor;
    S.terms.swap = row.cash_to_equity || '';
    S.terms.team = row.team_size || '';
    S.terms.days = row.office_days || '';
    S.terms.start = row.earliest_start || '';
    S.terms.noticeWeeks = row.notice_weeks || '';
    S.terms.reloc = row.relocation || '';
    S.terms.relocCities = row.preferred_cities || [];
    S.terms.industries = row.industries_preferred || [];
    S.terms.industry = S.terms.industries.length ? 'some' : 'any';
    S.terms.trial = row.interview_steps_ok || [];
    S.terms.note = row.looking_note || '';
  }
  if (row.intent) S.intent = row.intent;
  save();
}

// Which screen a signed-back-in candidate should land on, inferred from
// how far their saved row got. Builder and terms are only written
// together, in one shot, at the final submit, so either both are there
// or neither is.
function resumeScreenFromProfile(row) {
  if (!row) return 'reach';
  if (!row.contact_channel) return 'reach';
  if (!row.linkedin_url) return 'connect';
  if (!row.city) return 'builder';
  return 'radar';
}

function otpValue(wrapId) {
  const w = document.getElementById(wrapId);
  if (!w) return '';
  return [].slice.call(w.querySelectorAll('.cell')).map(function (c) { return c.value; }).join('');
}

function wire() {
  // OTP typing behaviour
  ['emailotp', 'waotp'].forEach(function (id) {
    const w = document.getElementById(id);
    if (!w) return;
    const cells = [].slice.call(w.querySelectorAll('.cell'));
    cells[0].focus();
    cells.forEach(function (c, i) {
      c.addEventListener('input', function () {
        c.value = c.value.replace(/\D/g, '').slice(0, 1);
        if (c.value && cells[i + 1]) cells[i + 1].focus();
      });
      c.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !c.value && cells[i - 1]) cells[i - 1].focus();
      });
      c.addEventListener('paste', function (e) {
        const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, cells.length);
        if (!t) return;
        e.preventDefault();
        t.split('').forEach(function (d, n) { if (cells[n]) cells[n].value = d; });
        cells[Math.min(t.length, cells.length - 1)].focus();
      });
    });
  });

  // city typeahead
  const city = document.getElementById('city');
  if (city) {
    const menu = document.getElementById('citymenu');
    const draw = function () {
      const q = city.value.toLowerCase();
      const hits = CITIES.filter(function (c) { return !q || c.toLowerCase().indexOf(q) > -1; }).slice(0, 7);
      menu.innerHTML = hits.map(function (c) { return '<div class="mi" data-city="' + c + '">' + c + '</div>'; }).join('');
      menu.classList.toggle('show', hits.length > 0);
    };
    city.addEventListener('focus', draw);
    city.addEventListener('input', draw);
    menu.addEventListener('mousedown', function (e) {
      const mi = e.target.closest('.mi');
      if (!mi) return;
      e.preventDefault();
      S.terms.city = mi.dataset.city;
      save(); render();
    });
    city.addEventListener('blur', function () { setTimeout(function () { menu.classList.remove('show'); }, 120); });
  }

  // cash floor: typed, digits only, no up/down steppers. Synced into state
  // on every keystroke, not just at submit: any other question on this
  // page re-renders the whole screen on click, which would otherwise wipe
  // whatever was typed here back to its last-saved value.
  const floorInput = document.getElementById('floorinput');
  if (floorInput) {
    floorInput.addEventListener('input', function () {
      const digits = floorInput.value.replace(/\D/g, '');
      if (digits !== floorInput.value) floorInput.value = digits;
      if (digits) { S.terms.floor = parseInt(digits, 10); save(); }
    });
  }

  // notice period: typed weeks, digits only, same live-sync as the floor.
  const noticeInput = document.getElementById('noticeweeks');
  if (noticeInput) {
    noticeInput.addEventListener('input', function () {
      const digits = noticeInput.value.replace(/\D/g, '');
      if (digits !== noticeInput.value) noticeInput.value = digits;
      S.terms.noticeWeeks = digits ? parseInt(digits, 10) : '';
      save();
    });
  }

  // relocation cities: typeahead that adds to a list instead of one value.
  // The suggestion list is a curated ~35 cities, not exhaustive, so a city
  // that isn't in it can still be added directly: "Add '<what you typed>'"
  // shows up as its own option, and Enter adds it without needing a click.
  const relocCityInput = document.getElementById('relocCityInput');
  if (relocCityInput) {
    const menu = document.getElementById('relocCityMenu');
    const addCity = function (name) {
      const c = name.trim();
      if (!c || S.terms.relocCities.indexOf(c) > -1) return;
      S.terms.relocCities.push(c);
      relocCityInput.value = '';
      save(); render();
    };
    const draw = function () {
      const raw = relocCityInput.value.trim();
      const q = raw.toLowerCase();
      const hits = CITIES.filter(function (c) {
        return (!q || c.toLowerCase().indexOf(q) > -1) && S.terms.relocCities.indexOf(c) === -1;
      }).slice(0, 6);
      let html = hits.map(function (c) { return '<div class="mi" data-city="' + esc(c) + '">' + esc(c) + '</div>'; }).join('');
      const exact = CITIES.some(function (c) { return c.toLowerCase() === q; });
      if (raw && !exact && S.terms.relocCities.indexOf(raw) === -1) {
        html += '<div class="mi" data-city="' + esc(raw) + '">Add "' + esc(raw) + '"</div>';
      }
      menu.innerHTML = html;
      menu.classList.toggle('show', html.length > 0);
    };
    relocCityInput.addEventListener('focus', draw);
    relocCityInput.addEventListener('input', draw);
    relocCityInput.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const firstMi = menu.querySelector('.mi');
      addCity(firstMi ? firstMi.dataset.city : relocCityInput.value);
    });
    menu.addEventListener('mousedown', function (e) {
      const mi = e.target.closest('.mi');
      if (!mi) return;
      e.preventDefault();
      addCity(mi.dataset.city);
    });
    relocCityInput.addEventListener('blur', function () { setTimeout(function () { menu.classList.remove('show'); }, 120); });
  }

  // industry "Other": typed, live-synced so it survives a re-render
  // triggered by any other question on the page.
  const industryOtherEl = document.getElementById('industryOther');
  if (industryOtherEl) {
    industryOtherEl.addEventListener('input', function () {
      S.terms.industryOtherText = industryOtherEl.value;
      save();
    });
  }

  // "what are you looking for": live word count, soft-capped at 500
  const noteEl = document.getElementById('tnote');
  if (noteEl) {
    const noteCount = document.getElementById('tnote-count');
    const update = function () {
      let words = noteEl.value.trim().split(/\s+/).filter(Boolean);
      if (words.length > 500) {
        words = words.slice(0, 500);
        noteEl.value = words.join(' ');
      }
      if (noteCount) noteCount.textContent = words.length + ' / 500 words';
    };
    noteEl.addEventListener('input', update);
    update();
  }
}

/* ---------------------------- routing ----------------------------
   Deployed at https://headhuntdev.com/candidate the app uses real
   paths (/candidate/login, /candidate/terms …). Anywhere else it
   falls back to hash routing so it still works from a file or a
   preview URL. Point every /candidate/* path at index.html — see
   vercel.json / nginx.conf in the deploy bundle.
   ---------------------------------------------------------------- */

const BASE = '/candidate';
const ROUTES = {
  curtain: '', hero: 'welcome', identity: 'login', emailcode: 'verify',
  signin: 'signin', signincode: 'signin/verify',
  reach: 'reach', wanumber: 'whatsapp', wacode: 'whatsapp/verify',
  connect: 'linkedin', reading: 'linkedin/reading', found: 'review',
  builder: 'work', terms: 'terms', radar: 'radar', vouch: 'vouch'
};
const SCREEN_OF = Object.keys(ROUTES).reduce(function (m, k) { m[ROUTES[k]] = k; return m; }, {});
const pathMode = location.pathname.indexOf(BASE) === 0;

function urlFor(screen) {
  const slug = ROUTES[screen] || '';
  return pathMode ? (BASE + (slug ? '/' + slug : '')) : (location.pathname + (slug ? '#' + slug : '#'));
}

function screenFromUrl() {
  let slug;
  if (pathMode) slug = location.pathname.slice(BASE.length).replace(/^\/|\/$/g, '');
  else slug = location.hash.replace(/^#/, '');
  return SCREEN_OF[slug] || null;
}

// "reading" is a ~2s auto-advancing animation, not a real stop: the fetch
// that drives it only runs once, from the li-fetch click. Landing back on
// it via browser back/forward (or a reload) leaves it stuck forever with
// nothing left to finish it, so treat it as not landable outside that
// one brief window and send people back to the linkedin form instead.
let readingInFlight = false;
const PRE_VERIFY_SCREENS = { identity: 1, emailcode: 1, signin: 1, signincode: 1 };
function landableScreen(s) {
  if (s === 'reading' && !readingInFlight) return 'connect';
  // Once an email is verified there is no code-request page left to land
  // on: back/forward/reload can get no further back than "reach", so
  // there is never a second code sent for an address already verified.
  if (S.auth.verified && PRE_VERIFY_SCREENS[s]) return 'reach';
  return s;
}

const _go = go;
go = function (screen) {
  _go(screen);
  const u = urlFor(screen);
  if (u === location.pathname + location.hash) return;
  // "reading" is a transient loader, not a real stop: replace the current
  // entry instead of pushing a new one, so back-navigation from whatever
  // follows it lands one press away, not two.
  if (screen === 'reading') history.replaceState({ screen: screen }, '', u);
  else history.pushState({ screen: screen }, '', u);
};

window.addEventListener('popstate', function () {
  const raw = screenFromUrl();
  const s = landableScreen(raw);
  if (s) {
    S.screen = s; save(); render();
    if (s !== raw) history.replaceState({ screen: s }, '', urlFor(s));
  }
});
window.addEventListener('hashchange', function () {
  const raw = screenFromUrl();
  const s = landableScreen(raw);
  if (s && s !== S.screen) {
    S.screen = s; save(); render();
    if (s !== raw) history.replaceState({ screen: s }, '', urlFor(s));
  }
});

// Reopening the exact invite link they already started on: resume right
// where they left off instead of re-running the gate. Their invite may
// already read as "used" by now (redemption happens straight after email
// verification, long before the flow is actually done), which would
// otherwise dead-end a legitimate, still-mid-flow candidate.
const resuming = !!(ENTRY_CODE && S.inviteCode === ENTRY_CODE && S.screen && S.screen !== 'curtain' && S.screen !== 'checking');

const fromUrl = screenFromUrl();
if (fromUrl && !resuming) S.screen = fromUrl;
S.screen = landableScreen(S.screen);
render();
history.replaceState({ screen: S.screen }, '', urlFor(S.screen));


function cfg(k){ return typeof CONFIG !== 'undefined' && CONFIG[k]; }
function hasOAuth(){ return cfg('GOOGLE_SIGNIN') || cfg('APPLE_SIGNIN'); }

(async function entry() {
  const code = ENTRY_CODE;

  if (resuming) return;

  if (code) {
    show('checking');
    const r = await API.lookupInvite(code);
    if (r.state === 'ok') {
      S.inviteCode = code;
      S.inviteState = 'ok';
      S.mode = 'invited';
      S.referrer = r.referrer_name || S.referrer;
      S.expiresAt = r.expires_at || '';
      save();
      API.openInvite(code);
      show('curtain');
    } else if (r.state === 'expired' || r.state === 'used') {
      S.inviteState = r.state;
      S.mode = 'request';
      S.referrer = r.referrer_name || S.referrer;
      S.expiresAt = r.expires_at || '';
      save();
      // a batch link that ran out of seats sends them to ask, not to a dead end
      if (r.state === 'used' && r.kind === 'seed') show('curtain');
      else show(r.state === 'used' ? 'used' : 'expired');
    } else if (r.state === 'error') {
      // a database hiccup should not turn away someone holding a real invite
      S.inviteCode = code; S.mode = 'invited'; save();
      show('curtain');
    } else {
      S.mode = 'request'; save();
      show('curtain');
    }
    return;
  }

  // arrived with no link: they can ask, not enter
  if (!S.inviteCode && !S.auth.verified) { S.mode = 'request'; save(); show('curtain'); }
})();

(async function(){
  if(!sb) return;

})();
